[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # astral-tokio-tar ended maintenance on 2026-11-03 with no successor release; replacing it is its own change
  { id = "RUSTSEC-2026-0440", reason = "no maintained release exists; etar owns the replacement" },
  # chrono and humantime reach etar only through the object_store dev-dependency
  { id = "RUSTSEC-2026-0543", reason = "dev-dependency of object_store only" },
  { id = "RUSTSEC-2026-0542", reason = "dev-dependency of object_store only" },
]

[licenses]
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

# The vendored erofs-utils in erofs/upstream carries GPL-2.0-only and Unlicense files
[[licenses.exceptions]]
crate = "etar"
allow = ["GPL-2.0-only"]

[bans]
multiple-versions = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
