name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ""

jobs:
  # the one required check: lint, tests, the vendored erofs-utils, the package, the advisories and the MSRV
  gate:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.97"
          components: clippy, rustfmt
      - run: rustup toolchain install 1.96 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-deny,cargo-semver-checks
      - run: just check
      - run: just doc-check
      - run: just test-ci
      - run: just test-doc
      - run: just erofs-vendor && test -z "$(git status --porcelain -- erofs)"
      - run: just test-erofs
      - run: just package-check
      - run: just audit
      - run: just msrv
      # a pull request carrying a version no tag names is a release: its branch names it and it breaks no API that version may not break
      - env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          plan="$(bash scripts/release.sh plan)"
          if [ "$plan" != "version=" ]; then bash scripts/release.sh check "$HEAD_REF"; fi
