name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ""

jobs:
  release:
    if: ${{ vars.ETAR_RELEASE_ENABLED == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release):')) }}
    environment: crates-io
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.97"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-deny,cargo-semver-checks,git-cliff
      - run: just check
      - run: just test-ci
      - run: just test-doc
      - run: just doc-check
      - run: just package-check
      - run: just release-test
      - run: just audit
      - name: get a short-lived crates.io token
        id: crates
        uses: rust-lang/crates-io-auth-action@v1.0.5
      - name: release a conventional version
        run: bash scripts/release.sh
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
          GH_TOKEN: ${{ github.token }}
