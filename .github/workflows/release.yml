name: Release

# a version on main which no tag names yet publishes it; a manual run finishes a release that stopped half way
on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: plan
        run: bash scripts/release.sh plan | tee -a "$GITHUB_OUTPUT"

  # crates.io trusts this workflow file and the crates-io environment, and hands out a short-lived token
  release:
    needs: plan
    if: needs.plan.outputs.version != ''
    environment: crates-io
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      COMMIT: ${{ needs.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.97"
      - id: crates
        uses: rust-lang/crates-io-auth-action@v1.0.5
      # a rerun after a publish which went through skips it
      - env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
        run: |
          if curl -fsS -A "eliosai-etar-release" "https://crates.io/api/v1/crates/etar/$VERSION" >/dev/null; then
            echo "etar $VERSION is on crates.io already"
          else
            cargo publish -p etar --locked
          fi
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --target "$COMMIT" --generate-notes --title "v$VERSION"
