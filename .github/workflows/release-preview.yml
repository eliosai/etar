name: release-preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-semver-checks,git-cliff
      - run: just release-plan
      - run: just release-test
      - name: check first-release changelog generation
        if: ${{ hashFiles('CHANGELOG.md') == '' }}
        run: git-cliff --tag v0.1.0 --unreleased --output "$RUNNER_TEMP/etar-first-changelog.md"
      - run: just package-check
